apply plugin: 'java'
apply plugin: 'eclipse'
eclipse {
    project {
        name = 'WorldResettingExtraJar'
    }
}

group 'org.greenem.plugins.worldresettingextrajar'
version '1.6.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.yaml:snakeyaml:1.30'
}

sourceSets {
    main {
        java {
            srcDirs 'src'
        }
        resources {
            srcDir 'resources' 
        }
    }
}

jar {
	manifest {
		attributes(
			'Main-Class': 'me.greenem.plugins.worldResetExtra.Main'
		)
	}
	
	//archiveBaseName = 'ResetWorldAndRestart'
	archiveFileName.set("ResetWorldAndRestart.jar")
    //destinationDirectory.set(file("C:/Users/andpo/Desktop/Vanya/1.18.2/plugins"))
    destinationDirectory.set(file("C:/Users/andpo/Desktop/Vanya/Plugins/WorldResettingSeparate/resources/extraFiles"))
    configurations.implementation.canBeResolved=true
    from { configurations.implementation.collect {
      //it.canBeResolved = true 
      it.isDirectory() ? it : zipTree(it) } 
    }
    //with jar
}



compileJava {
    options.release = 8
}